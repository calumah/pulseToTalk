[project]
name = "pulsetotalk"
version = "1.3.1"
description = "Simple \"push to talk\" for Pulseaudio on GNU/Linux Desktop in user mode wrote in python (command line only)"
authors = [{ name = "Lucas Lebas", email = "calummah@gmail.com" }]
license = "GPL-3.0-or-later"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pulsectl>=24.11.0",
    "python-xlib>=0.33",
    "colorlog>=6.9.0",
    "pyxhook>=1.0.0",
    "tk>=0.1.0",
    "pillow>=10.1",
]

[project.optional-dependencies]
# Wayland-capable input backend (reads /dev/input). Builds a C extension, so
# it is kept optional: `uv sync --extra evdev`.
evdev = ["evdev>=1.6.1"]
# Real-time voice effects (--voice) through a virtual mic.
voice = ["numpy>=2.0"]

[project.scripts]
pulsetotalk = "pulsetotalk.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pulsetotalk"]

[dependency-groups]
dev = [
    "ipython",
    "ruff",
    "pre-commit",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle + pyflakes
    "I",             # isort
    "UP",            # pyupgrade
    "B",             # flake8-bugbear
    "SIM",           # flake8-simplify
    "C4",            # flake8-comprehensions
    "RUF",           # ruff-specific
    "PL",            # pylint
    "PERF",          # perflint
    "PTH",           # flake8-use-pathlib
    "RET",           # flake8-return
    "ARG",           # flake8-unused-arguments
    "N",             # pep8-naming
    "D",             # pydocstyle
    "ANN",           # flake8-annotations
    "TRY",           # tryceratops
    "EM",            # flake8-errmsg
    "FBT",           # flake8-boolean-trap
]

ignore = [
    # Lazy imports of optional backends (pyxhook / evdev) are intentional:
    # they keep each dependency optional and give friendly errors when missing.
    "PLC0415",
    # Boolean-trap rules fight unavoidable third-party APIs
    # (pulsectl `mute(obj, bool)`, tkinter `attributes('-topmost', True)`).
    "FBT001", "FBT002", "FBT003",
]

[tool.ruff.lint.pydocstyle]
convention = "google"
